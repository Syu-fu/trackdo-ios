name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # uniffi-bindgen only forwards to UniFFI's generator.
      - name: Coverage
        run: cargo llvm-cov --workspace --exclude uniffi-bindgen --locked --fail-under-lines 80

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build XCFramework
        run: scripts/build-xcframework.sh
      - name: Test with coverage
        run: scripts/swift-coverage.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-server/v*
          key: trackdo-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-server.sh') }}
      - name: Integration tests
        run: scripts/integration-test.sh
      - name: Server log
        if: failure()
        run: cat target/test-server/server.log || true
      - name: Build the app for iOS Simulator
        run: scripts/build-app.sh -quiet
      - name: Check localizations
        run: scripts/check-localizations.sh
