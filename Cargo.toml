[workspace]
resolver = "3"
members = ["crates/trackdo-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Syu-fu/trackdo-ios"
publish = false

[workspace.dependencies]
trackdo-core = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.3.0" }
trackdo-protocol = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.3.0" }
thiserror = "2"
# Bindings must be generated by the exact UniFFI version the library uses.
uniffi = "=0.32.2"
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
