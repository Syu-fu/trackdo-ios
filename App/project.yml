# Generates Trackdo.xcodeproj: `xcodegen generate --spec App/project.yml`.
name: Trackdo
options:
  bundleIdPrefix: dev.syufu
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  TrackdoKit:
    path: ../TrackdoKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    # Strings come from the code into App/Sources/Localizable.xcstrings;
    # scripts/check-localizations.sh keeps the catalog in step.
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    TARGETED_DEVICE_FAMILY: "1"
    # TrackdoFFIC has no Intel simulator slice.
    ARCHS: arm64
targets:
  Trackdo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: TrackdoKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: trackdo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # DADS defines only a light palette; keep system bars and sheets
        # light too until a dark one exists.
        UIUserInterfaceStyle: Light
        # Plain http is accepted for development servers on the local
        # network only; ServerURL refuses it for other hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: trackdo syncs with the server you set up on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.syufu.trackdo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
